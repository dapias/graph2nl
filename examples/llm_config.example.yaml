# Example LLM configuration for net2narratives.
# Copy to my_llm_config.yaml and edit. The configurations used for the
# paper's results are in configs/ (do not edit those).

base_url: https://chat-ai.academiccloud.de/v1   # any OpenAI-compatible endpoint
api_key_env: GWDG_API_KEY                         # name of the environment variable holding your key
model: gpt-oss-120b
prompt_template: full_protocol                    # bundled: full_protocol, naive, scientific_minimal; or a path
temperature: 0.3                                  # value used in the paper
max_tokens: 4000