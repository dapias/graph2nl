[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "net2narratives"
version = "1.0.0"	
description = "Validated LLM interpretation of statistical association networks (partial-correlation matrices) as natural language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Diego Tapias" }]
dependencies = [
    "openai>=1.0",
    "pyyaml",
    "python-dotenv",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
net2narratives-interpret = "net2narratives.interpret:main"
net2narratives-validate = "net2narratives.validation.run_validation:main"
# net2narratives-rescore and net2narratives-analyze-failures are not yet included in
# this release (net2narratives/validation/rescore.py and analyze_failures.py
# don't exist here yet) -- re-add once those modules are added.

[tool.setuptools.packages.find]
include = ["net2narratives*"]

[tool.setuptools.package-data]
net2narratives = ["prompts/*.md"]

[tool.setuptools.dynamic]
version = {attr = "net2narratives.__version__"}